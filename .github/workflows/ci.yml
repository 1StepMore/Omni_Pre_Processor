name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv pytest pytest-cov
          uv pip install --python .venv python-docx python-pptx pymupdf lxml translate-toolkit

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          .venv/bin/python -m pytest tests/ -v --cov=src/opp --cov-report=term-missing