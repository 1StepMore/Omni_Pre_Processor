name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: |
          uv pip install -e ".[all]" || { echo "=== INSTALL FAILED ==="; uv pip install -e ".[all]" --verbose; exit 1; }

      - name: Verify installation
        run: |
          echo "=== Verifying installation ==="
          .venv/bin/python -c "import opp; print('opp imported successfully')"
          .venv/bin/python -c "from opp.extractors.pdf import PDFExtractor; print('PDFExtractor imported successfully')"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          echo "=== Running tests ==="
          .venv/bin/python -m pytest tests/ -v --tb=short
