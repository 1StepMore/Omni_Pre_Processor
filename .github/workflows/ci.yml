name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Opt into Node.js 24 ahead of GitHub's forced upgrade on 2026-06-16.
# When removed (post-2026-09-16), this env var becomes a no-op.
# See: https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "0.11.8"
          python-version: "3.13"

      - name: Verify uv.lock is up to date (fail-loud guard)
        run: uv --no-config lock --check

      - name: Create virtual environment (pinned to Python 3.13)
        run: uv venv --python 3.13 .venv

      - name: Install base + dev + mcp dependencies
        run: |
          # .[dev]  = pytest, pytest-cov
          # .[mcp]  = mcp, fastmcp, pyyaml (needed by tests/mcp/test_server.py
          #          and tests/mcp/test_security_attacks.py)
          uv pip install --python .venv/bin/python -e ".[dev,mcp]"

      - name: Install extra test dependencies (extractors, OCR, etc.)
        run: |
          uv pip install --python .venv/bin/python \
            openpyxl pandas chardet markdownify readability-lxml ebooklib \
            beautifulsoup4 docling extract-msg rapidocr-onnxruntime pytesseract \
            Pillow faster-whisper 'markitdown[youtube]' pydub nbformat \
            pytest-timeout pytest-asyncio

      - name: Verify Python + opp import
        run: |
          .venv/bin/python -c "import sys; print(f'Python {sys.version}')"
          .venv/bin/python -c "import opp; print(f'opp OK ({opp.__version__})')"

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
          OMNI_TEST_FAKE_LLM: "1"
          OMNI_TEST_FAKE_PANDOC: "1"
        shell: bash
        run: |
          echo "=== Running tests ==="
          set -o pipefail
          .venv/bin/python -m pytest tests/ -v --tb=short --timeout=120 2>&1 | tee test_output.log
          exit_status=$?
          echo "=== Test exit code: ${exit_status} ==="
          tail -100 test_output.log
          exit ${exit_status}





  # Suite validation: OPP's own scenarios (scenarios/opp/ + tool-opp-*)
  # via the Omni Suite validation framework's per-module filter.
  # Hermetic (tier 1, no LLM keys, no mocks) — the suite repo provides
  # the engine + scenario library; the sub-repos are cloned fresh by
  # scripts/clone_subrepos.sh.
  validate:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Clone Omni Suite (engine + scenarios + fixtures)
        uses: actions/checkout@v4
        with:
          repository: renanzai40/OmniSuite_BackUp
          path: suite
          ref: main

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.11.8"

      - name: Clone 3 sub-repos into the suite (workspace members for uv sync)
        working-directory: suite
        run: bash scripts/clone_subrepos.sh

      - name: uv sync (root workspace)
        working-directory: suite
        run: uv sync --locked

      - name: Create .venv_ol symlink for legacy paths
        working-directory: suite
        run: ln -s .venv .venv_ol

      - name: Ensure .venv/bin/python exists
        working-directory: suite
        run: cd .venv/bin && [ ! -e python ] && [ -e python3 ] && ln -s python3 python; cd -

      - name: Install this repo's OPP over the cloned upstream (validate THIS HEAD)
        working-directory: suite
        run: |
          rm -rf Omni_Pre_Processor
          cp -r ${{ github.workspace }} Omni_Pre_Processor
          uv pip install --python .venv/bin/python -e ./Omni_Pre_Processor

      - name: Run OPP validation scenarios (tier 1, hermetic)
        working-directory: suite
        env:
          MCP_ALLOWED_DIRECTORIES: /tmp
          OPP_MCP_ALLOWED_DIRS: /tmp
          OMNI_RATE_LIMIT_RPM: "0"
        run: |
          .venv/bin/python scripts/validation/run_validation.py --module opp --tier 1
