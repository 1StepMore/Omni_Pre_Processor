name: Publish

on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g., 1.0.0)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install dependencies
        run: |
          uv pip install --python .venv pytest pytest-cov pytest-asyncio
          uv pip install --python .venv mcp "fastmcp[cli]" beautifulsoup4 ebooklib python-docx python-pptx pymupdf lxml translate-toolkit openpyxl pandas chardet

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          .venv/bin/python -m pytest tests/test_auto_detector.py tests/test_error_handler.py tests/mcp/test_security.py tests/mcp/test_server.py -v --tb=short

  verify-version:
    name: Verify Version
    runs-on: ubuntu-latest
    needs: [test]
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from tag
        id: extract
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "is_tag=true" >> $GITHUB_OUTPUT
          else
            VERSION="0.1.0"
            echo "is_tag=false" >> $GITHUB_OUTPUT
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Verify version format
        if: steps.extract.outputs.is_tag == 'true'
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          if [[ ! $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Invalid version format '$VERSION'. Expected semantic version (e.g., 1.0.0)"
            exit 1
          fi
          echo "Version $VERSION is valid"

      - name: Verify version matches pyproject.toml
        if: steps.extract.outputs.is_tag == 'true'
        run: |
          VERSION="${{ steps.extract.outputs.version }}"
          PROJECT_VERSION=$(grep '__version__' src/opp/__init__.py | sed "s/.*= *['\"]\([^'\"]*\)['\"].*/\1/")
          if [[ "$VERSION" != "$PROJECT_VERSION" ]]; then
            echo "Error: Tag version '$VERSION' does not match project version '$PROJECT_VERSION'"
            exit 1
          fi
          echo "Version $VERSION verified against project"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [verify-version]
    outputs:
      dist_dir: dist
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Create virtual environment
        run: uv venv .venv

      - name: Install build dependencies
        run: |
          uv pip install --python .venv build hatchling

      - name: Build package
        run: |
          .venv/bin/python -m build

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    runs-on: ubuntu-latest
    needs: [build, verify-version]
    environment:
      name: testpypi
      url: https://test.pypi.org/project/opp/
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  # =============================================================================
  # JOB 5: Publish to PyPI - Manual trigger only (after TestPyPI verified)
  # =============================================================================
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [publish-testpypi]
    if: github.event_name == 'workflow_dispatch'
    environment:
      name: pypi
      url: https://pypi.org/project/opp/
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1