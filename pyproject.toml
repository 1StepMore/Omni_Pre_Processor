[project]
name = "opp"
version = "0.1.0"
description = "Omni Pre-Processor: Document content extraction package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "pymupdf>=1.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["src/opp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["src"]
exclude = ["tests", "**/__pycache__"]
reportMissingTypeStubs = false
reportDeprecated = false
reportUnusedVariable = false
reportUnusedImport = false
reportMissingParameterType = false
pythonVersion = "3.12"