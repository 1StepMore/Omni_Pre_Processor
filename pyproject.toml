[project]
# ULTRAREADY-VERIFY (2026-06-22): renamed distribution from "opp"
# to "omni-pre-processor" because "opp" is owned on PyPI by
# OpenPaymentPlatform/python (PAY.ON payment processing library).
# Re-publish under the original (previously-blocked) name; the
# import package stays "opp" so existing `from opp import ...` and
# the `opp` / `opp-mcp-server` console scripts are unaffected.
name = "omni-pre-processor"
version = "0.8.2"
description = "Omni Pre-Processor: Document content extraction package"
readme = "README.md"
requires-python = ">=3.13"
license = {text = "MIT"}
authors = [
    {name = "OPP Contributors"}
]
keywords = ["document", "extraction", "pdf", "docx", "pptx", "markdown", "xliff", "translation", "ocr", "content-extraction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing",
    "Topic :: Text Processing :: General",
]
dependencies = [
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "pymupdf>=1.27.0",
    "translate-toolkit>=3.0.0",
    "lxml>=5.0.0",
    "python-json-logger>=2.0.0",
    "prometheus_client>=0.20.0",
    "beautifulsoup4>=4.12.0",
    "ebooklib>=0.5.0",
    "openpyxl>=3.1.5,<3.2",
    "pandas>=2.0.0",
    "chardet>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]
office = [
    "numpy>=2.0.0",
]
web = [
    "markdownify>=0.14.0",
    "readability-lxml>=0.8.0",
    "docling>=1.0.0",
]
email = [
    "extract-msg>=0.55.0",
]
ocr = ["rapidocr-onnxruntime>=1.3"]
youtube = ["markitdown[youtube-transcription]>=0.0.1"]
audio = [
    "faster-whisper",
    "pydub>=0.23.0",
    "torch>=2.0.0",
]
notebook = [
    "nbformat>=5.0.0",
]
mcp = [
    "mcp>=1.0.0",
    "fastmcp>=1.0.0",
    "pyyaml>=5.0.0",
]
all = [
    "markitdown[audio,notebook,office,web,email,ocr,mcp,youtube]",
]

[project.scripts]
opp = "opp.cli:main"
opp-mcp-server = "opp.mcp.server:main"

[project.urls]
Homepage = "https://github.com/1StepMore/Omni_Pre_Processor"
Repository = "https://github.com/1StepMore/Omni_Pre_Processor"
Documentation = "https://github.com/1StepMore/Omni_Pre_Processor#readme"
Changelog = "https://github.com/1StepMore/Omni_Pre_Processor/blob/main/CHANGELOG.md"
Issues = "https://github.com/1StepMore/Omni_Pre_Processor/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/opp"]

[tool.hatch.build.targets.sdist]
include = [
    "src/opp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/opp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["src"]
exclude = ["tests", "**/__pycache__"]
pythonVersion = "3.13"
