[project]
name = "opp"
dynamic = ["version"]
description = "Omni Pre-Processor: Document content extraction package"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-docx>=1.0.0",
    "python-pptx>=1.0.0",
    "pymupdf>=1.27.0",
    "translate-toolkit>=3.0.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-cov>=7.0.0",
]
office = [
    "openpyxl>=3.0.0",
    "pandas>=2.0.0",
    "chardet>=5.0.0",
]
web = [
    "markdownify>=0.14.0",
    "readability-lxml>=0.8.0",
    "ebooklib>=0.5.0",
    "beautifulsoup4>=4.12.0",
    "docling>=1.0.0",
]
email = [
    "extract-msg>=2.4.0",
    "rapidocr-onnxruntime>=1.3.0",
]
audio = [
    "nbformat>=5.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.version]
path = "src/opp/__init__.py"

[tool.coverage.run]
source = ["src/opp"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.pyright]
include = ["src"]
exclude = ["tests", "**/__pycache__"]
reportMissingTypeStubs = false
reportDeprecated = false
reportUnusedVariable = false
reportUnusedImport = false
reportMissingParameterType = false
pythonVersion = "3.12"
