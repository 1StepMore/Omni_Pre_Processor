# OPP MCP Server Configuration for Hermes
# This file shows how to configure OPP as an MCP server in your Hermes agent configuration.

# Hermes uses mcp_servers to define external MCP server connections.
# Add this snippet to your Hermes agent configuration file.

# =============================================================================
# RECOMMENDED: Using --config (self-contained, agent-oriented)
# =============================================================================
# Create an opp_mcp_config.yaml file with your settings, then reference it:
#
#   security:
#     allowed_directories:
#       - /path/to/documents
#       - /path/to/output
#
#   max_file_size_bytes: 104857600
#   request_timeout_seconds: 60
#   resource_storage_dir: ./mcp_resources

mcp_servers:
  opp:
    command: uvx
    args:
      - opp-mcp-server
      - --config
      - /path/to/opp_mcp_config.yaml
    env: {}

# =============================================================================
# ALTERNATIVE: Using environment variables (simpler, no config file)
# =============================================================================
# If you prefer not to use a config file, set via env variables:
#
# mcp_servers:
#   opp:
#     command: uvx
#     args:
#       - opp-mcp-server
#     env:
#       OPP_MCP_ALLOWED_DIRS: "/path/to/documents:/path/to/output"
#       # OPP_MCP_MAX_FILE_SIZE: "104857600"
#       # OPP_MCP_TIMEOUT: "60"
#       # OPP_MCP_RESOURCE_DIR: "./mcp_resources"
#       # OPP_LOG_LEVEL: "DEBUG"

# =============================================================================
# MANUAL SERVER START (no auto-start)
# =============================================================================
# If you prefer to start the server manually before running Hermes:
#
# 1. Install OPP with MCP support:
#    pip install -e ".[mcp]"
#
# 2. Start the server in one terminal:
#    python -m opp.mcp.server
#    # or
#    opp-mcp-server --config /path/to/opp_mcp_config.yaml
#
# 3. Configure Hermes to connect to the running server:
#
# mcp_servers:
#   opp:
#     command: python
#     args:
#       - -m
#       - opp.mcp.server
#     # Server must already be running when Hermes starts
